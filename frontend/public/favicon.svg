<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0d0f17"/>

  <!-- Building outline (white) -->
  <rect x="20" y="22" width="24" height="30" rx="1" fill="none" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Building floors: horizontal lines -->
  <line x1="20" y1="29" x2="44" y2="29" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
  <line x1="20" y1="36" x2="44" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
  <line x1="20" y1="43" x2="44" y2="43" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

  <!-- Center column glow (violet) -->
  <rect x="28" y="22" width="8" height="30" rx="0.5" fill="#8b5cf6" opacity="0.35"/>

  <!-- Top glow -->
  <ellipse cx="32" cy="22" rx="6" ry="3" fill="#8b5cf6" opacity="0.5"/>

  <!-- Base / ground line -->
  <line x1="17" y1="52" x2="47" y2="52" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- WiFi / signal arcs (violet, top-right of building) -->
  <path d="M40 18 Q45 13 50 18" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M42 15 Q47  8 52 15" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
  <path d="M44 12 Q49  3 54 12" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>